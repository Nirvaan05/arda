id = "arda"
name = "ARDA"
version = "0.1.0"
min_herdr_version = "0.9.3"
description = "One plugin to rule them all: coding agents in Herdr find each other by name and hand off tasks across sessions and machines."
platforms = ["linux"]

[[actions]]
id = "status"
title = "ARDA status"
contexts = ["global", "workspace"]
command = ["python3", "-m", "arda", "status"]

[[actions]]
id = "introduce"
title = "ARDA: introduce the agents to each other"
description = "Tell every idle named agent in every reachable Herdr session and machine its ARDA address, its peers and how to reach them."
contexts = ["global", "workspace"]
command = ["python3", "-m", "arda", "introduce"]
